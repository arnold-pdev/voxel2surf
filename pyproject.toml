[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxel2surf"
version = "0.1.0"
description = "Binary voxel occupancy to a smooth watertight STL (cuberille + constrained variational fairing)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Arnold"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
decimate = ["pyvista>=0.43"]

[project.scripts]
voxel2surf = "voxel2surf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
